<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spotify</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <header class="login-header">
            <i class="fab fa-spotify logo-icon"></i>
            <span class="logo-text">Spotify</span>
        </header>

        <div class="login-container">
            <h2>Log in to Spotify</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Email address or username</label>
                    <input type="text" id="username" placeholder="Email address or username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" checked>
                        <span>Remember me</span>
                    </label>
                </div>
                <button type="submit" class="login-btn">Log In</button>
                <div class="divider">
                    <span>Don't have an account?</span>
                </div>
                <button type="button" class="signup-btn">Sign up for Spotify</button>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
